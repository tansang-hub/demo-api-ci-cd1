name: Restful-Booker CI Pipeline

on: [push, pull_request] # Tự chạy khi có sự kiện Push hoặc Pull Request

jobs:
  api-testing:
    runs-on: ubuntu-latest # Chạy trên máy chủ ảo Linux (Ubuntu) của GitHub

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4 # Tải code từ Repo về máy chủ ảo

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. Cài đặt công cụ Newman (Postman CLI)
        run: npm install -g newman # Newman là công cụ cho phép chạy Postman bằng dòng lệnh

      - name: 4. Chạy bộ Test tự động
        # Chạy Collection với Environment file tương tự như bấm "Run" trên Postman
        run: newman run RestfulBooker.postman_collection.json -e RestfulBooker.postman_environment.json
